# Diagnostic candidate only. Do not connect production before testing source access.
services:
  - type: web
    name: xot-rezka-test
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: npm run server:rezka
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: XOT_SERVER_TOKEN
        generateValue: true
      - key: XOT_REZKA_ORIGIN
        value: https://rezka-ua.pub
