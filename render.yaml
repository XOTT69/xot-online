# Diagnostic candidate only. Do not connect production before testing source access.
services:
  - type: web
    name: xot-rezka-test
    runtime: node
    plan: free
    region: frankfurt
    # Vercel's unrelated deployment status must not block this Node service.
    # The Render build itself runs the repository's deterministic checks.
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund && npm test
    startCommand: npm run server:rezka
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: XOT_SERVER_TOKEN
        generateValue: true
      - key: XOT_REZKA_ORIGIN
        value: https://rezka-ua.pub
      - key: XOT_VERIFY_MEDIA
        value: "1"
